<title>José Carlos Christiano de Sousa — LegalPass</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:radial-gradient(120% 80% at 50% 0%,#1c1c22 0%,#0b0b0d 60%); color:#f5f5f7;
         min-height:100vh; display:flex; justify-content:center; padding:32px 18px 40px; }
  .card { width:100%; max-width:420px; text-align:center; }
  .avatar { width:150px; height:150px; border-radius:50%; margin:6px auto 18px; display:block;
            border:3px solid rgba(255,255,255,.12); box-shadow:0 12px 34px rgba(0,0,0,.55); }
  h1 { font-size:25px; font-weight:700; margin:0 0 4px; letter-spacing:-.02em; }
  .role { font-size:15px; color:#a8adb5; margin:0 0 16px; }
  .logo-pill { display:inline-flex; align-items:center; background:#fff; border-radius:999px;
               padding:9px 16px; margin-bottom:26px; }
  .logo-pill img { height:22px; display:block; }
  .btns { display:flex; flex-direction:column; gap:11px; }
  a.btn, button.btn { font:inherit; cursor:pointer; text-decoration:none; display:flex; align-items:center;
        gap:14px; width:100%; padding:15px 18px; border-radius:15px; border:1px solid #2b2b31;
        background:#161619; color:#f5f5f7; font-size:16px; font-weight:500; transition:.15s; }
  a.btn:active, button.btn:active { transform:scale(.985); background:#1d1d21; }
  .btn svg { width:22px; height:22px; flex:0 0 22px; }
  .btn .lbl { text-align:left; }
  .btn .sub { display:block; font-size:12px; color:#8b9098; font-weight:400; margin-top:1px; }
  .btn.primary { background:#fff; color:#0b0b0d; border-color:#fff; font-weight:650; justify-content:center; }
  .btn.primary .sub { color:#55585e; }
  .foot { margin-top:26px; font-size:12px; color:#6b6f77; }
</style>
